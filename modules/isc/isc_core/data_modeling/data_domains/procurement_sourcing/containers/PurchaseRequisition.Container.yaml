  requestDateTime:
    type:
      list: false
      type: timestamp
    immutable: false
    nullable: true
    autoIncrement: false
  fulfillmentOrderId:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
  fulfillmentOrderItem:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
  destinationLocationId:
    type:
      list: false
      type: direct
    immutable: false
    nullable: true
    autoIncrement: false
  sourcePlantId:
    type:
      list: false
      type: direct
    immutable: false
    nullable: true
    autoIncrement: false
  unitEstimatedPrice:
    type:
      list: false
      type: float64
    immutable: false
    nullable: true
    autoIncrement: false
  materialRequestType:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
  isDeleted:
    type:
      list: false
      type: boolean
    immutable: false
    nullable: true
    autoIncrement: false
    description: Deletion indicator. If true, the PR item has been flagged for deletion.
  processingStatus:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    description: Processing status of the PR item for example N for not processed, B for PO created. rocessingStatus.
  prReleaseStatus:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    description: Release and approval status of the PR for example released, not released, blocked. urReqnReleaseStatus.
  prItemText:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    description: Short text description of the requisition item. urchaseRequisitionItemText.
  prOrigin:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    description: Origin of the purchase requisition for example manual entry, MRP-generated, maintenance order. urReqnOrigin.
  purchasingGroup:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    description: Purchasing group code. Identifies the buyer or group responsible for converting this PR to a PO.
  materialGroup:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    description: Material group code. Groups materials with similar characteristics for reporting and sourcing.
  baseUnit:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    description: Base unit of measure for the requested material for example EA, KG, M.
  releaseDate:
    type:
      list: false
      type: timestamp
    immutable: false
    nullable: true
    autoIncrement: false
    description: Date on which the purchase requisition was formally released or approved. urchaseRequisitionReleaseDate.
  currency:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    description: Currency code for the PR item price for example NOK, USD.
  priceQuantity:
    type:
      list: false
      type: float64
    immutable: false
    nullable: true
    autoIncrement: false
    description: The quantity basis for the unit price for example price per 1, per 100. urReqnPriceQuantity.
  supplierNumber:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    description: Supplier account number from the source ERP system assigned or preferred for this requisition.
  purchaseContract:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    description: Reference to a long-term Purchase Contract or outline agreement number.
  purchaseOrderDate:
    type:
      list: false
      type: timestamp
    immutable: false
    nullable: true
    autoIncrement: false
    description: Date of the Purchase Order that was created from this requisition.
  materialPlannedDeliveryDays:
    type:
      list: false
      type: int64
    immutable: false
    nullable: true
    autoIncrement: false
    description: Planned delivery time in calendar days for the material. Used for lead time risk analysis.
  manufacturerPartNumber:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    description: Manufacturers Part Number for the material. Useful for cross-referencing with equipment BOMs.
  material:
    type:
      list: false
      type: direct
    immutable: false
    nullable: true
    autoIncrement: false
    name: Material
    description: Direct relation to the MaterialMaster node for the material being requisitioned. Typed relation alongside the materialId text field for graph traversal.
  supplier:
    type:
      list: false
      type: direct
    immutable: false
    nullable: true
    autoIncrement: false
    name: Supplier
    description: Direct relation to the Supplier node preferred for this requisition. Typed relation alongside the supplierNumber text field. Null when no preferred supplier is specified.
indexes:
  workOrderId:
    indexType: btree
    properties:
    - workOrderId
    cursorable: false
  destinationLocationId:
    indexType: btree
    properties:
    - destinationLocationId
    cursorable: false
  sourcePlantId:
    indexType: btree
    properties:
    - sourcePlantId
    cursorable: false
  material:
    indexType: btree
    properties:
    - material
    cursorable: false
  supplier:
    indexType: btree
    properties:
    - supplier
    cursorable: false
usedFor: node