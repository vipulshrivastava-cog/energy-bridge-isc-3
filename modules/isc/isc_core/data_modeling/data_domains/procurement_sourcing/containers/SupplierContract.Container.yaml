space: {{ isc_SourcingProcurementSchemaSpace }}
externalId: SupplierContract
name: SupplierContract
description: Stores long-term framework agreements. Defines pre-negotiated volumes, pricing tiers, and legal terms that govern multiple Purchase Orders over time.
properties:
  name:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Name
    description: Human-readable name for this node.
  description:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Description
    description: Human-readable description for this node.
  sourceId:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source ID
    description: Identifier from the upstream source system.
  sourceContext:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source Context
    description: Source system or context for this node.
  sourceCreatedTime:
    type:
      list: false
      type: timestamp
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source Created Time
    description: Timestamp when the node was created in the source system.
  sourceUpdatedTime:
    type:
      list: false
      type: timestamp
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source Updated Time
    description: Timestamp when the node was last updated in the source system.
  sourceCreatedUser:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source Created User
    description: User that created this node in the source system.
  sourceUpdatedUser:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source Updated User
    description: User that last updated this node in the source system.
  contractID:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: false
    autoIncrement: false
    name: Contract ID
    description: Unique identifier for the supplier contract in the source system. Primary identifier - not nullable.
  contractType:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Contract Type
    description: Classification of the agreement for example LP for Quantity Contract, MK for Scheduling Agreement. Determines call-off and release order behaviour.
  supplier:
    type:
      list: false
      type: direct
    immutable: false
    nullable: true
    autoIncrement: false
    name: Supplier
    description: Direct relation to the Supplier node that is party to this contract.
  materialId:
    type:
      list: false
      type: direct
    immutable: false
    nullable: true
    autoIncrement: false
    name: Material
    description: Direct relation to the MaterialMaster node for the primary material covered by this contract, when single-material contracts.
  plant:
    type:
      list: false
      type: direct
    immutable: false
    nullable: true
    autoIncrement: false
    name: Plant
    description: Direct relation to the FunctionalAsset node for the plant or site this contract is valid for. Multi-plant contracts may have separate entries per plant.
  purchasingOrganization:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Purchasing Organization
    description: Purchasing Organization that negotiated and manages this contract. Used for spend analysis by organizational unit.
  companyCode:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Company Code
    description: Company or legal entity code from the source ERP system - legal entity the contract is booked under for financial accounting purposes.
  validFrom:
    type:
      list: false
      type: timestamp
    immutable: false
    nullable: true
    autoIncrement: false
    name: Valid From
    description: Effective start date of this contract. Purchase orders can only be created against this contract from this date.
  validTo:
    type:
      list: false
      type: timestamp
    immutable: false
    nullable: true
    autoIncrement: false
    name: Valid To
    description: Expiry date of this contract. Drives contract renewal alerts and supply continuity risk assessment.
  currency:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Currency
    description: Document currency for all monetary values on this contract for example NOK, USD, EUR.
  targetValue:
    type:
      list: false
      type: float64
    immutable: false
    nullable: true
    autoIncrement: false
    name: Target Value
    description: Total committed value agreed in the contract. When fully consumed, no further call-offs can be raised.
  targetQuantity:
    type:
      list: false
      type: int64
    immutable: false
    nullable: true
    autoIncrement: false
    name: Target Quantity
    description: Total committed quantity agreed in the contract for quantity contracts.
  contractedQuantityUsed:
    type:
      list: false
      type: float64
    immutable: false
    nullable: true
    autoIncrement: false
    name: Contracted Quantity Used
    description: Quantity already called off against this contract via purchase orders. Compared against targetQuantity to track utilisation and remaining headroom.
  contractedValueUsed:
    type:
      list: false
      type: float64
    immutable: false
    nullable: true
    autoIncrement: false
    name: Contracted Value Used
    description: Value already called off against this contract via purchase orders. Compared against targetValue to track spend utilisation.
  contractPrice:
    type:
      list: false
      type: float64
    immutable: false
    nullable: true
    autoIncrement: false
    name: Contract Price
    description: Agreed unit price or pricing tier in the contract. Used as the default price when creating purchase orders from this contract.
  paymentTerms:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Payment Terms
    description: Payment terms for purchase orders created from this contract for example NET30. Overrides supplier-level defaults.
  incoterms:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Incoterms
    description: Delivery terms for call-offs under this contract for example EXW, FOB, DAP.
  incotermsLocation:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Incoterms Location
    description: Named place associated with the incoterms for example FOB Rotterdam.
  contractStatus:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Contract Status
    description: Current lifecycle state of the contract for example Active, Expired, Suspended, Closed. Drives contract management alerts.
  createdOn:
    type:
      list: false
      type: timestamp
    immutable: false
    nullable: true
    autoIncrement: false
    name: Created On
    description: Date on which this contract record was initially created in the source system.
  contractFile:
    type:
      list: false
      type: direct
    immutable: false
    nullable: true
    autoIncrement: false
    name: Contract File
    description: Direct relation to the CogniteFile node containing the signed supplier contract document. Enables document access from the Command Centre without leaving the data model.
indexes:
  contractID:
    properties:
    - contractID
    cursorable: true
    indexType: btree
  supplier:
    properties:
    - supplier
    cursorable: false
    indexType: btree
  materialId:
    properties:
    - materialId
    cursorable: false
    indexType: btree
  plant:
    properties:
    - plant
    cursorable: false
    indexType: btree
  purchasingOrganization:
    properties:
    - purchasingOrganization
    cursorable: true
    indexType: btree
  validFrom:
    properties:
    - validFrom
    cursorable: true
    indexType: btree
  validTo:
    properties:
    - validTo
    cursorable: true
    indexType: btree
  contractStatus:
    properties:
    - contractStatus
    cursorable: true
    indexType: btree
  contractFile:
    properties:
    - contractFile
    cursorable: false
    indexType: btree
usedFor: node