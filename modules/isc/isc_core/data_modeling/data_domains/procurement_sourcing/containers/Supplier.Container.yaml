  sourceUpdatedUser:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source Updated User
    description: User that last updated this node in the source system.
  supplierId:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Supplier ID
    description: Unique identifier for the supplier in the source system.
  certificationStatus:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
