  parentOrganizationId:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Parent Organization ID
    description: Text identifier of the parent supplier or holding company.
  parentOrganizationDescription:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Parent Organisation Description
    description: Human-readable name of the parent organisation.
