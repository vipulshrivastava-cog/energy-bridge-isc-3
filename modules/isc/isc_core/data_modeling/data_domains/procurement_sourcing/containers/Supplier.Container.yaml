space: {{ isc_SourcingProcurementSchemaSpace }}
externalId: Supplier
name: Supplier
description: Central supplier master record for managing vendor identity, performance KPIs, certifications, risk ratings, and relationship health. Site-level details, addresses, contacts, commercial terms, are modelled separately in SupplierFacility.
properties:
  name:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Name
    description: Human-readable name for this node.
  description:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Description
    description: Human-readable description for this node.
  sourceId:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
