space: {{ isc_SourcingProcurementSchemaSpace }}
externalId: SupplierFacility
name: SupplierFacility
description: A physical operating location, manufacturing plant, warehouse, distribution centre, office, of a supplier. One Supplier can have many SupplierFacility nodes. Carries site-level address, contact, and commercial term details. Links upward to the Supplier master and laterally to GeoLocations for geographic hierarchy traversal.
