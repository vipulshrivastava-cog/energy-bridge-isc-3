space: {{ isc_SourcingProcurementSchemaSpace }}
externalId: PurchaseOrderLineItem
name: Purchase Order Line Item
description: Consolidated view combining PO header and line item properties.
version: '{{viewVersion}}'
properties:
  name:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderHeader
      type: container
    containerPropertyIdentifier: name
    name: Name
    description: Human-readable name for this node.
  description:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderHeader
      type: container
    containerPropertyIdentifier: description
    name: Description
    description: Human-readable description for this node.
  sourceId:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderHeader
      type: container
    containerPropertyIdentifier: sourceId
    name: Source ID
    description: Identifier from the upstream source system.
  sourceContext:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderHeader
      type: container
    containerPropertyIdentifier: sourceContext
    name: Source Context
    description: Source system or context for this node.
  sourceCreatedTime:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderHeader
      type: container
    containerPropertyIdentifier: sourceCreatedTime
    name: Source Created Time
    description: Timestamp when the node was created in the source system.
  sourceUpdatedTime:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderHeader
      type: container
    containerPropertyIdentifier: sourceUpdatedTime
    name: Source Updated Time
    description: Timestamp when the node was last updated in the source system.
  sourceCreatedUser:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderHeader
      type: container
    containerPropertyIdentifier: sourceCreatedUser
    name: Source Created User
    description: User that created this node in the source system.
  sourceUpdatedUser:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderHeader
      type: container
    containerPropertyIdentifier: sourceUpdatedUser
    name: Source Updated User
    description: User that last updated this node in the source system.
  scheduledReceipts:
    source:
      space: {{ isc_ShipmentDeliverySchemaSpace }}
      externalId: ScheduledReceipt
      version: '{{viewVersion}}'
      type: view
    through:
      source:
        space: {{ isc_ShipmentDeliverySchemaSpace }}
        externalId: ScheduledReceipt
        version: '{{viewVersion}}'
        type: view
      identifier: poLineItem
    name: Scheduled Receipts
    description: Scheduled receipt commitments associated with this PO line item.
    connectionType: multi_reverse_direct_relation
  purchaseOrderConfirmations:
    source:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderConfirmation
      version: '{{viewVersion}}'
      type: view
    through:
      source:
        space: {{ isc_SourcingProcurementSchemaSpace }}
        externalId: PurchaseOrderConfirmation
        version: '{{viewVersion}}'
        type: view
      identifier: poLineItem
    name: Purchase Order Confirmations
    description: All supplier confirmations and revisions received for this PO line item.
    connectionType: multi_reverse_direct_relation
  purchaseOrderId:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderHeader
      type: container
    containerPropertyIdentifier: purchaseOrderId
    name: Purchase Order ID
    description: Purchase order number from the source ERP system. Unique identifier for the purchasing document.
  purchasingOrganization:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderHeader
      type: container
    containerPropertyIdentifier: purchasingOrganization
    name: Purchasing Organisation
    description: Purchasing organisation code from the source ERP system responsible for this PO.
  orderDate:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderHeader
      type: container
    containerPropertyIdentifier: orderDate
    name: Order Date
    description: Date the legal commitment was formalised with the supplier.
  createdByUser:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderHeader
      type: container
    containerPropertyIdentifier: createdByUser
    name: Created By User
    description: User ID of the person who created the purchase order in the source ERP system.
  supplier:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderHeader
      type: container
    containerPropertyIdentifier: supplier
    name: Supplier
    description: Direct relation to the Supplier, vendor, fulfilling this purchase order.
    source:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: Supplier
      version: '{{viewVersion}}'
      type: view
  companyCode:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderHeader
      type: container
    containerPropertyIdentifier: companyCode
    name: Company Code
    description: Company or legal entity code from the source ERP system. Legal entity responsible for this purchase order.
  currency:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderHeader
      type: container
    containerPropertyIdentifier: currency
    name: Currency
    description: Document currency code for all financial values on this PO.
  totalNetValue:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderHeader
      type: container
    containerPropertyIdentifier: totalNetValue
    name: Total Net Value
    description: Total net value of all line items in this purchase order in document currency.
  incoterms:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderHeader
      type: container
    containerPropertyIdentifier: incoterms
    name: Incoterms
    description: Header-level delivery terms code defining the risk and cost transfer point.
  incotermsLocation:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderHeader
      type: container
    containerPropertyIdentifier: incotermsLocation
    name: Incoterms Location
    description: Named place associated with the header incoterms.
  purchasingProcessingStatus:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderHeader
      type: container
    containerPropertyIdentifier: purchasingProcessingStatus
    name: Purchasing Processing Status
    description: Overall processing status of the purchasing document for example Open, Partially Processed, Closed.
  purchasingCompletenessStatus:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderHeader
      type: container
    containerPropertyIdentifier: purchasingCompletenessStatus
    name: Purchasing Completeness Status
    description: True if the PO is fully complete - all items delivered and invoiced.
  releaseIsNotCompleted:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderHeader
      type: container
    containerPropertyIdentifier: releaseIsNotCompleted
    name: Release Is Not Completed
    description: True if the PO has not yet been fully released through the approval workflow.
  poStatus:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderHeader
      type: container
    containerPropertyIdentifier: poStatus
    name: Purchase Order Status
    description: Lifecycle status of the purchase order header - Accepted, Rejected, Modified, or Deleted.
  previousPoStatus:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderHeader
      type: container
    containerPropertyIdentifier: previousPoStatus
    name: Previous Purchase Order Status
    description: Purchase order status before the last change. Same naming pattern as MasterNotification.previousState.
  statusChangedAt:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderHeader
      type: container
    containerPropertyIdentifier: statusChangedAt
    name: Status Changed At
    description: Timestamp when poStatus last changed in the source system.
  headerShipTo:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderHeader
      type: container
    containerPropertyIdentifier: shipTo
    name: Header Ship To
    description: Direct relation to the FunctionalAsset node for the header-level delivery destination of this purchase order.
    source:
      space: {{ isc_AssetMaintenanceSchemaSpace }}
      externalId: FunctionalAsset
      version: '{{viewVersion}}'
      type: view
  purchaseOrderRef:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderItem
      type: container
    containerPropertyIdentifier: purchaseOrderId
    name: Purchase Order ID (Line FK)
    description: Foreign key on the purchaseOrderItemId container linking this line back to its parent purchase order.
  purchaseOrderItemId:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderItem
      type: container
    containerPropertyIdentifier: purchaseOrderItemId
    name: Purchase Order Item ID
    description: Line item number within the Purchase Order, e.g. 00010, 00020. Composite primary key with purchaseOrderId.
  itemCurrency:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderItem
      type: container
    containerPropertyIdentifier: currency
    name: Item Currency
    description: Document currency code for this specific PO line item.
  itemDescription:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderItem
      type: container
    containerPropertyIdentifier: itemDescription
    name: Item Description
    description: Short text description of the PO line item.
  material:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderItem
      type: container
    containerPropertyIdentifier: material
    name: Material
    description: Direct relation to the MaterialMaster node for the material being ordered.
    source:
      space: {{ isc_MaterialManagementSchemaSpace }}
      externalId: MaterialMaster
      version: '{{viewVersion}}'
      type: view
  shipTo:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderItem
      type: container
    containerPropertyIdentifier: shipTo
    name: Ship To
    description: Direct relation to the FunctionalAsset node for the item-level delivery destination.
    source:
      space: {{ isc_AssetMaintenanceSchemaSpace }}
      externalId: FunctionalAsset
      version: '{{viewVersion}}'
      type: view
  supplierItemRecord:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderItem
      type: container
    containerPropertyIdentifier: supplierItemRecord
    name: Supplier Item Record
    description: Direct relation to the SupplierItemRecord used as the source for pricing and delivery terms on this PO item.
    source:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: SupplierItemRecord
      version: '{{viewVersion}}'
      type: view
  unitOfMeasure:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderItem
      type: container
    containerPropertyIdentifier: unitOfMeasure
    name: Unit of Measure
    description: Unit of measure for quantityOrdered and quantityReceived fields for example EA, KG, M.
  quantityOrdered:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderItem
      type: container
    containerPropertyIdentifier: quantityOrdered
    name: Quantity Ordered
    description: Total quantity of material contracted for delivery under this PO line item.
  quantityReceived:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderItem
      type: container
    containerPropertyIdentifier: quantityReceived
    name: Quantity Received
    description: Cumulative quantity processed through Goods Receipt against this PO item.
  netPrice:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderItem
      type: container
    containerPropertyIdentifier: netPrice
    name: Net Price
    description: Agreed-upon cost per unit, excluding taxes and logistics fees.
  netOrderValue:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderItem
      type: container
    containerPropertyIdentifier: netOrderValue
    name: Net Order Value
    description: Total net value of this line item, calculated as quantityOrdered multiplied by netPrice in document currency.
  requestedDeliveryDate:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderItem
      type: container
    containerPropertyIdentifier: requestedDeliveryDate
    name: Requested Delivery Date
    description: Requested arrival date at the destination site gate. Used for on-time delivery tracking.
  previousRequestedDeliveryDate:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderItem
      type: container
    containerPropertyIdentifier: previousRequestedDeliveryDate
    name: Previous Requested Delivery Date
    description: Delivery date before the last ERP update. Mirrors PurchaseOrderConfirmation baseline date semantics.
  requestedDeliveryDateChangeDays:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderItem
      type: container
    containerPropertyIdentifier: requestedDeliveryDateChangeDays
    name: Requested Delivery Date Change Days
    description: Signed day delta between previousRequestedDeliveryDate and requestedDeliveryDate. Positive indicates slip. Negative indicates pull-in.
  requestedShipDate:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderItem
      type: container
    containerPropertyIdentifier: requestedShipDate
    name: Requested Ship Date
    description: Requested ship date from the supplier location.
  contractualDate:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderItem
      type: container
    containerPropertyIdentifier: contractualDate
    name: Contractual Date
    description: The contractually binding date - either the delivery date or ship date depending on the applicable incoterm.
  lineItemIncoterm:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderItem
      type: container
    containerPropertyIdentifier: lineItemIncoterm
    name: Line Item Incoterm
    description: Delivery terms code for this specific line item. Inherited from PO header incoterms unless overridden.
  lineIncotermLocation:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderItem
      type: container
    containerPropertyIdentifier: lineIncotermLocation
    name: Line Item Incoterm Location
    description: Named place associated with the line item incoterm.
  goodsReceiptLatestDate:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderItem
      type: container
    containerPropertyIdentifier: goodsReceiptLatestDate
    name: Goods Receipt Latest Date
    description: Date of the most recent goods receipt posted for this PO item.
  latestConfirmedDeliveryDate:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderItem
      type: container
    containerPropertyIdentifier: latestConfirmedDeliveryDate
    name: Latest Confirmed Delivery Date
    description: Most recent delivery date confirmed by the supplier.
  itemStatus:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderItem
      type: container
    containerPropertyIdentifier: itemStatus
    name: Item Status
    description: Current lifecycle state of the line item for example Open, Partially Received, Closed.
  currentConfirmationStatus:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderItem
      type: container
    containerPropertyIdentifier: currentConfirmationStatus
    name: Current Confirmation Status
    description: Most recent supplier confirmation status, Confirmed, Pending, Backorder, Rejected.
  purchaseRequisition:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderItem
      type: container
    containerPropertyIdentifier: purchaseRequisition
    name: Purchase Requisition
    description: Direct relation to the PurchaseRequisition node that originated this PO line item.
    source:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseRequisition
      version: '{{viewVersion}}'
      type: view
  supplierContract:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderItem
      type: container
    containerPropertyIdentifier: supplierContract
    name: Supplier Contract
    description: Direct relation to the SupplierContract governing this PO item.
    source:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: SupplierContract
      version: '{{viewVersion}}'
      type: view
  isCompletelyDelivered:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderItem
      type: container
    containerPropertyIdentifier: isCompletelyDelivered
    name: Is Completely Delivered
    description: True if the PO item has been fully delivered. Key KPI for procurement completion and work order readiness tracking.
  isFinallyInvoiced:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderItem
      type: container
    containerPropertyIdentifier: isFinallyInvoiced
    name: Is Finally Invoiced
    description: True if the PO item has been finally invoiced. Signals financial closure.
  purchaseOrderDeletionCode:
    container:
      space: {{ isc_SourcingProcurementSchemaSpace }}
      externalId: PurchaseOrderItem
      type: container
    containerPropertyIdentifier: purchaseOrderDeletionCode
    name: Deletion Code
    description: Deletion indicator for this PO line item - Blank for Active, L for Deleted.
