space: {{ isc_ShipmentDeliverySchemaSpace }}
externalId: StockTransferOrder
name: StockTransferOrder
description: Planning and commitment document for moving material resources between internal sites, plants, or offshore assets for example transferring a spare part from an onshore warehouse to a specific rig. Plan layer for intersite transfers. The scheduled movement is tracked on ScheduledTransfer. physical execution is tracked downstream.
properties:
  name:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Name
    description: Human-readable name for this node.
  description:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Description
    description: Human-readable description for this node.
  sourceId:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source ID
    description: Identifier from the upstream source system.
  sourceContext:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source Context
    description: Source system or context for this node.
  sourceCreatedTime:
    type:
      list: false
      type: timestamp
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source Created Time
    description: Timestamp when the node was created in the source system.
  sourceUpdatedTime:
    type:
      list: false
      type: timestamp
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source Updated Time
    description: Timestamp when the node was last updated in the source system.
  sourceCreatedUser:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source Created User
    description: User that created this node in the source system.
  sourceUpdatedUser:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source Updated User
    description: User that last updated this node in the source system.
  stockTransportId:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: false
    autoIncrement: false
    name: Stock Transport ID
    description: Unique identifier for the Stock Transport Order in the source system, Purchase order number from the source ERP system for document type UB. Primary identifier - not nullable.
  stoStatus:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: STO Status
    description: Current processing status of the Stock Transport Order for example Open, In Transit, Goods Received, Closed. Used for tracking fulfilment progress and triggering downstream replenishment actions.
  stockTransportType:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Stock Transport Type
    description: Type classification of the stock transport for example UB for Stock Transfer Order, planned stock transfer, cross-plant replenishment. Determines posting logic and movement types used during execution.
  materialId:
    type:
      list: false
      type: direct
    immutable: false
    nullable: true
    autoIncrement: false
    name: Material
    description: Direct relation to the MaterialMaster node for the material being transferred.
  unitOfMeasure:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Unit of Measure
    description: Base unit of measure for the requested quantity on this stock transport order for example EA, KG, M.
  supplyingPlant:
    type:
      list: false
      type: direct
    immutable: false
    nullable: true
    autoIncrement: false
    name: Supplying Plant
    description: Direct relation to the FunctionalAsset node representing the plant issuing the goods. Plant-level reference for MRP planning and inter-plant stock visibility.
  originSite:
    type:
      list: false
      type: direct
    immutable: false
    nullable: true
    autoIncrement: false
    name: Origin Site
    description: Direct relation to the FunctionalAsset for the supplying storage location from which goods are issued, same role as supplyingStorageLocation in source ERP stock transfer process.
  receivingPlant:
    type:
      list: false
      type: direct
    immutable: false
    nullable: true
    autoIncrement: false
    name: Receiving Plant
    description: Direct relation to the FunctionalAsset node representing the plant receiving the goods. Plant-level reference for MRP planning and inventory replenishment tracking.
  destinationSite:
    type:
      list: false
      type: direct
    immutable: false
    nullable: true
    autoIncrement: false
    name: Destination Site
    description: Direct relation to the FunctionalAsset for the receiving storage location where goods will be stored upon receipt, same role as receivingStorageLocation in source ERP stock transfer process.
  originWarehouse:
    type:
      list: false
      type: direct
    immutable: false
    nullable: true
    autoIncrement: false
    name: Origin Warehouse
    description: Direct relation to the issuing warehouse. Use when the endpoint is warehouse management storage rather than a plant site code.
  destinationWarehouse:
    type:
      list: false
      type: direct
    immutable: false
    nullable: true
    autoIncrement: false
    name: Destination Warehouse
    description: Direct relation to the receiving warehouse for the stock transfer.
  quantityRequested:
    type:
      list: false
      type: float64
    immutable: false
    nullable: true
    autoIncrement: false
    name: Quantity Requested
    description: Total quantity of material requested for transfer from the supplying location to the receiving location.
  createdOn:
    type:
      list: false
      type: timestamp
    immutable: false
    nullable: true
    autoIncrement: false
    name: Created On
    description: Date on which this Stock Transport Order was created in the source system. Used for ageing analysis and lead time measurement.
  expectedArrivalDate:
    type:
      list: false
      type: timestamp
    immutable: false
    nullable: true
    autoIncrement: false
    name: Expected Arrival Date
    description: Planned date on which goods are expected to arrive at the receiving location as requested on the order. Used for planning and material readiness assessment.
