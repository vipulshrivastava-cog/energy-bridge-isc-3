space: {{ isc_ShipmentDeliverySchemaSpace }}
externalId: ScheduledReceipt
name: ScheduledReceipt
description: Plan-layer inbound receipt. Physical execution uses ShipmentExecutesReceipt edges with ASN and BoL and actual properties on the edge.
properties:
  name:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Name
    description: Human-readable name for this node.
  description:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Description
    description: Human-readable description for this node.
  sourceId:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source ID
    description: Identifier from the upstream source system.
  sourceContext:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source Context
    description: Source system or context for this node.
  sourceCreatedTime:
    type:
      list: false
      type: timestamp
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source Created Time
    description: Timestamp when the node was created in the source system.
  sourceUpdatedTime:
    type:
      list: false
      type: timestamp
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source Updated Time
    description: Timestamp when the node was last updated in the source system.
  sourceCreatedUser:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source Created User
    description: User that created this node in the source system.
  sourceUpdatedUser:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source Updated User
    description: User that last updated this node in the source system.
  scheduledReceiptId:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: false
    autoIncrement: false
    name: Scheduled Receipt ID
    description: Unique identifier for the scheduled receipt line. Primary identifier - not nullable.
  scheduledReceiptLineNumber:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Scheduled Receipt Line Number
    description: Line number within the scheduled receipt to distinguish individual receipt lines when a single purchase order confirmation generates multiple receipt lines.
  deliveryType:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Delivery Type
    description: Type of inbound delivery for example Standard, Returns, Subcontracting.
  scheduledQuantity:
    type:
      list: false
      type: float64
    immutable: false
    nullable: true
    autoIncrement: false
    name: Scheduled Quantity
    description: Planned quantity committed on this scheduled receipt line.
  originCountry:
    type:
      list: false
      type: direct
    immutable: false
    nullable: true
    autoIncrement: false
    name: Origin Country
    description: Direct relation to the GeoLocations country from which the goods were shipped.
  originSupplierSite:
    type:
      list: false
      type: direct
    immutable: false
    nullable: true
    autoIncrement: false
    name: Origin Supplier Site
    description: Direct relation to the SupplierFacility node representing the physical supplier site from which goods were dispatched.
  destinationCountry:
    type:
      list: false
      type: direct
    immutable: false
    nullable: true
    autoIncrement: false
    name: Destination Country
    description: Direct relation to the GeoLocations country where goods are being delivered.
  destinationSite:
    type:
      list: false
      type: direct
    immutable: false
    nullable: true
    autoIncrement: false
    name: Destination Site
    description: Direct relation to the FunctionalAsset for the internal plant receiving the goods, organizational supply chain granularity. Complement with destinationWarehouse for WMS warehouse-level storage assignment. Both fields are required.
  destinationWarehouse:
    type:
      list: false
      type: direct
    immutable: false
    nullable: true
    autoIncrement: false
    name: Destination Warehouse
    description: Direct relation to the Warehouse receiving the goods, WMS warehouse hierarchy.
  scheduledPickupDate:
    type:
      list: false
      type: timestamp
    immutable: false
    nullable: true
    autoIncrement: false
    name: Scheduled Pickup Date
    description: Planned pickup date for this scheduled receipt line.
  scheduledArrivalDate:
    type:
      list: false
      type: timestamp
    immutable: false
    nullable: true
    autoIncrement: false
    name: Scheduled Arrival Date
    description: Planned arrival date for this scheduled receipt line.
  scheduleStatus:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Schedule Status
    description: "Schedule lifecycle status for this planned receipt. Allowed values: Open, PartiallyShipped, Closed, Cancelled."
  material:
    type:
      list: false
      type: direct
    immutable: false
    nullable: true
    autoIncrement: false
    name: Material
    description: Direct relation to the MaterialMaster node for the delivered material.
  poLineItem:
    type:
      list: false
      type: direct
    immutable: false
    nullable: true
    autoIncrement: false
    name: PO Line Item
    description: Direct relation to the PurchaseOrderLineItem that drives this planned receipt commitment.
  quantityUnit:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Quantity Unit
    description: Unit of measure for the scheduledQuantity field for example EA, KG, M. Required to make the quantity value actionable.
  supplier:
    type:
      list: false
      type: direct
    immutable: false
    nullable: true
    autoIncrement: false
    name: Supplier
    description: Direct relation to the Supplier node. Denormalised from the PO for fast supplier-level delivery performance queries without traversing through poLineItem.
  poConfirmation:
    type:
      list: false
      type: direct
    immutable: false
    nullable: true
    autoIncrement: false
    name: PO Confirmation
    description: Direct relation to the PurchaseOrderConfirmation node that confirmed this planned receipt. Enables direct access to the supplier confirmed date and quantity for variance calculations.
  transportationLane:
    type:
      list: false
      type: direct
    immutable: false
    nullable: true
    autoIncrement: false
    name: Transportation Lane
    description: Direct relation to the TransportationLane defining the standard route and lead time between origin and destination for this planned receipt.
  plannedTransitDays:
    type:
      list: false
      type: float64
    immutable: false
    nullable: true
    autoIncrement: false
    name: Planned Transit Days
    description: Snapshot of the transportation lane lead time at the time this receipt was planned. This value is never updated after creation so that variance calculations always reflect the original planning assumption.
  scheduleVsConfirmationDateVariance:
    type:
      list: false
      type: int32
    immutable: false
    nullable: true
    autoIncrement: false
    name: Schedule vs Confirmation Date Variance
    description: Difference in days between the scheduled arrival date and the confirmed delivery date from the purchase order confirmation. A positive value means the plan is scheduled later than what the supplier confirmed. Measures whether the logistics planner added buffer beyond the supplier confirmed date.
  scheduleVsConfirmationQtyVariance:
    type:
      list: false
      type: float64
    immutable: false
    nullable: true
    autoIncrement: false
    name: Schedule vs Confirmation Quantity Variance
    description: Difference between the confirmed quantity on the purchase order confirmation and the scheduled quantity across all split shipments. A positive value means the plan quantity is less than what was confirmed. Measures whether the scheduled quantity aligns with the confirmed quantity.
  arrivalDateVariance:
    type:
      list: false
      type: int32
    immutable: false
    nullable: true
    autoIncrement: false
    name: Arrival Date Variance
    description: Difference in days between the latest actual arrival date and the scheduled arrival date. A positive value indicates late arrival. This is the composite On Time measurement for delivery performance and can be decomposed using pickup date variance and transit variance days.
  receivedQtyVariance:
    type:
      list: false
      type: float64
    immutable: false
    nullable: true
    autoIncrement: false
    name: Received Quantity Variance
    description: Difference between the scheduled quantity and the total bill of lading quantity. A positive value indicates short delivery. This is the composite In Full measurement for delivery performance and can be decomposed using ASN vs scheduled quantity variance and BoL vs ASN quantity variance.
  originalArrivalDate:
    type:
      list: false
      type: timestamp
    immutable: false
    nullable: true
    autoIncrement: false
    name: Original Arrival Date
    description: Original planned arrival date before any revision. Compare against revisedArrivalDate to quantify inbound delay.
  revisedArrivalDate:
    type:
      list: false
      type: timestamp
    immutable: false
    nullable: true
    autoIncrement: false
    name: Revised Arrival Date
    description: Most recently revised arrival date after a delay or expedite. Null when the receipt has not been rescheduled.
  delayReason:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Delay Reason
    description: Free-text or coded reason for the arrival delay when revisedArrivalDate differs from originalArrivalDate.
indexes:
  scheduledReceiptLineNumber:
    properties:
    - scheduledReceiptId
    - scheduledReceiptLineNumber
    cursorable: true
    indexType: btree
  originSupplierSite:
    properties:
    - originSupplierSite
    cursorable: false
    indexType: btree
  destinationSite:
    properties:
    - destinationSite
    cursorable: false
    indexType: btree
  destinationWarehouse:
    properties:
    - destinationWarehouse
    cursorable: false
    indexType: btree
  material:
    properties:
    - material
    cursorable: false
    indexType: btree
  poLineItem:
    properties:
    - poLineItem
    cursorable: false
    indexType: btree
  supplier:
    properties:
    - supplier
    cursorable: false
    indexType: btree
  scheduledArrivalDate:
    properties:
    - scheduledArrivalDate
    cursorable: true
    indexType: btree
  poConfirmation:
    properties:
    - poConfirmation
    cursorable: false
    indexType: btree
  transportationLane:
    properties:
    - transportationLane
    cursorable: false
    indexType: btree
usedFor: node