space: {{ isc_ShipmentDeliverySchemaSpace }}
externalId: Shipment
name: Shipment
description: Tracks the physical movement of material lots via various modes, Vessel, Truck, Air, between company sites and optional geographic endpoints, providing real-time visibility into materials in transit.
properties:
  name:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Name
    description: Human-readable name for this node.
  description:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Description
    description: Human-readable description for this node.
  sourceId:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source ID
    description: Identifier from the upstream source system.
  sourceContext:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source Context
    description: Source system or context for this node.
  sourceCreatedTime:
    type:
      list: false
      type: timestamp
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source Created Time
    description: Timestamp when the node was created in the source system.
  sourceUpdatedTime:
    type:
      list: false
      type: timestamp
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source Updated Time
    description: Timestamp when the node was last updated in the source system.
  sourceCreatedUser:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source Created User
    description: User that created this node in the source system.
  sourceUpdatedUser:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source Updated User
    description: User that last updated this node in the source system.
  shipmentId:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: false
    autoIncrement: false
    name: Shipment ID
    description: Unique identifier for the shipment. Primary identifier - not nullable.
  modeOfTransport:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Mode of Transport
    description: Transport mode for this shipment for example Air, Sea, Road, Rail.
  originSite:
    type:
      list: false
      type: direct
    immutable: false
    nullable: true
    autoIncrement: false
    name: Origin Site
    description: Direct relation to the FunctionalAsset for the company origin storage or ship-from location, logical ERP and hierarchy view.
  destinationSite:
    type:
      list: false
      type: direct
    immutable: false
    nullable: true
    autoIncrement: false
    name: Destination Site
    description: Direct relation to the FunctionalAsset for the company destination storage or ship-to location, logical ERP and hierarchy view.
  originWarehouse:
    type:
      list: false
      type: direct
    immutable: false
    nullable: true
    autoIncrement: false
    name: Origin Warehouse
    description: Direct relation to the Warehouse for the ship-from storage location, WMS warehouse hierarchy.
  destinationWarehouse:
    type:
      list: false
      type: direct
    immutable: false
    nullable: true
    autoIncrement: false
    name: Destination Warehouse
    description: Direct relation to the Warehouse for the ship-to storage location, WMS warehouse hierarchy.
  originSupplierSite:
    type:
      list: false
      type: direct
    immutable: false
    nullable: true
    autoIncrement: false
    name: Origin Supplier Site
    description: Direct relation to a GeoLocations for the physical or supplier-side origin when it differs from the company origin site.
  destinationSupplierSite:
    type:
      list: false
      type: direct
    immutable: false
    nullable: true
    autoIncrement: false
    name: Destination Supplier Site
    description: Direct relation to a GeoLocations for the physical or customer-side destination when it differs from the company destination site.
  departureDate:
    type:
      list: false
      type: timestamp
    immutable: false
    nullable: true
    autoIncrement: false
    name: Departure Date
    description: Actual date the shipment left the origin site.
  estimatedArrivalDate:
    type:
      list: false
      type: timestamp
    immutable: false
    nullable: true
    autoIncrement: false
    name: Estimated Arrival Date
    description: Planned arrival date at the destination site.
  previousEstimatedArrivalDate:
    type:
      list: false
      type: timestamp
    immutable: false
    nullable: true
    autoIncrement: false
    name: Previous Estimated Arrival Date
    description: Prior ETA before the last shipment plan update.
  estimatedArrivalDateChangeDays:
    type:
      list: false
      type: float64
    immutable: false
    nullable: true
    autoIncrement: false
    name: Estimated Arrival Date Change Days
    description: Signed day delta between previousEstimatedArrivalDate and estimatedArrivalDate. Positive indicates slip. Negative indicates pull-in.
  actualArrivalDate:
    type:
      list: false
      type: timestamp
    immutable: false
    nullable: true
    autoIncrement: false
    name: Actual Arrival Date
    description: Realized arrival date at the destination site.
  trackingNumber:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Tracking Number
    description: Carrier tracking ID for real-time shipment monitoring.
  shipmentStatus:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Shipment Status
    description: Current stage of the shipment for example Planned, In Transit, Delivered, Delayed.
  lastUpdatedTimestamp:
    type:
      list: false
      type: timestamp
    immutable: false
    nullable: true
    autoIncrement: false
    name: Last Updated Timestamp
    description: Last time the shipment status was updated.
  carrier:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Carrier
    description: Logistics provider or carrier responsible for this shipment. Used for carrier performance tracking and freight cost allocation.
  shippingDocumentNumber:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Shipping Document Number
    description: Bill of lading, airway bill, or other primary shipping document reference number used for customs and carrier tracking.
  plannedDepartureDate:
    type:
      list: false
      type: timestamp
    immutable: false
    nullable: true
    autoIncrement: false
    name: Planned Departure Date
    description: Scheduled departure date from the origin site. Used for departure schedule adherence measurement.
  grossWeight:
    type:
      list: false
      type: float64
    immutable: false
    nullable: true
    autoIncrement: false
    name: Gross Weight
    description: Total gross weight of the shipment including packaging. Used for freight cost calculation and carrier capacity planning.
  weightUnit:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Weight Unit
    description: Unit of measure for the grossWeight field for example KG, LB, T.
  originalEstimatedArrivalDate:
    type:
      list: false
      type: timestamp
    immutable: false
    nullable: true
    autoIncrement: false
    name: Original Estimated Arrival Date
    description: Original planned arrival date before any revision. Compare against estimatedArrivalDate to compute delay days.
  originSupplierFacility:
    type:
      list: false
      type: direct
    immutable: false
    nullable: true
    autoIncrement: false
    name: Origin Supplier Facility
    description: Direct relation to the SupplierFacility for the physical supplier site this shipment originates from. Used for inbound shipments from external suppliers.
  supplier:
    type:
      list: false
      type: direct
    immutable: false
    nullable: true
    autoIncrement: false
    name: Supplier
    description: Direct relation to the Supplier fulfilling this shipment. Denormalised from the PO for direct supplier-level queries.
indexes:
  shipmentId:
    properties:
    - shipmentId
    cursorable: true
    indexType: btree
  originSite:
    properties:
    - originSite
    cursorable: false
    indexType: btree
  destinationSite:
    properties:
    - destinationSite
    cursorable: false
    indexType: btree
  originWarehouse:
    properties:
    - originWarehouse
    cursorable: false
    indexType: btree
  destinationWarehouse:
    properties:
    - destinationWarehouse
    cursorable: false
    indexType: btree
  originSupplierSite:
    properties:
    - originSupplierSite
    cursorable: false
    indexType: btree
  destinationSupplierSite:
    properties:
    - destinationSupplierSite
    cursorable: false
    indexType: btree
  carrier:
    properties:
    - carrier
    cursorable: true
    indexType: btree
  shippingDocumentNumber:
    properties:
    - shippingDocumentNumber
    cursorable: true
    indexType: btree
  plannedDepartureDate:
    properties:
    - plannedDepartureDate
    cursorable: true
    indexType: btree
usedFor: node