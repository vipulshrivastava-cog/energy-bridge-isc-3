space: {{ isc_TypedModelSchemaSpace }}
externalId: Warehouse
name: Warehouse
description: Top-level warehouse node in the storage hierarchy.
implements:
- space: {{ isc_MaterialManagementSchemaSpace }}
  externalId: StorageLocations
  version: '{{viewVersion}}'
  type: view
version: '{{viewVersion}}'
filter:
  and:
  - hasData:
    - type: container
      space: {{ isc_MaterialManagementSchemaSpace }}
      externalId: StorageLocations
  - equals:
      property:
      - {{ isc_MaterialManagementSchemaSpace }}
      - StorageLocations
      - declaredType
      value:
        space: {{ isc_OrganizationalFoundationSchemaSpace }}
        externalId: Warehouse
properties:
  declaredType:
    container:
      space: {{ isc_MaterialManagementSchemaSpace }}
      externalId: StorageLocations
      type: container
    containerPropertyIdentifier: declaredType
    source:
      space: {{ isc_OrganizationalFoundationSchemaSpace }}
      externalId: DeclaredTypes
      version: '{{viewVersion}}'
      type: view
    name: Declared Type
    description: Concrete view type for this instance.
  belongtoCity:
    container:
      space: {{ isc_MaterialManagementSchemaSpace }}
      externalId: StorageLocations
      type: container
    containerPropertyIdentifier: belongtoCity
    source:
      space: {{ isc_TypedModelSchemaSpace }}
      externalId: City
      version: '{{viewVersion}}'
      type: view
    name: Belong To City
    description: Geographic roll-up city for this warehouse.
  suppliesToSite:
    container:
      space: {{ isc_MaterialManagementSchemaSpace }}
      externalId: StorageLocations
      type: container
    containerPropertyIdentifier: suppliesToSite
    source:
      space: {{ isc_AssetMaintenanceSchemaSpace }}
      externalId: FunctionalAsset
      version: '{{viewVersion}}'
      type: view
    name: Supplies To Site
    description: ISA site or plant this warehouse serves.
  children:
    source:
      space: {{ isc_MaterialManagementSchemaSpace }}
      externalId: StorageLocations
      version: '{{viewVersion}}'
      type: view
    through:
      source:
        space: {{ isc_MaterialManagementSchemaSpace }}
        externalId: StorageLocations
        version: '{{viewVersion}}'
        type: view
      identifier: parent
    name: Children
    description: Storage hierarchy nodes with this node as their parent.
    connectionType: multi_reverse_direct_relation
  zones:
    source:
      space: {{ isc_TypedModelSchemaSpace }}
      externalId: Zone
      version: '{{viewVersion}}'
      type: view
    through:
      source:
        space: {{ isc_MaterialManagementSchemaSpace }}
        externalId: StorageLocations
        type: container
      identifier: parent
    name: Zones
    description: Zones in this warehouse.
    connectionType: multi_reverse_direct_relation
