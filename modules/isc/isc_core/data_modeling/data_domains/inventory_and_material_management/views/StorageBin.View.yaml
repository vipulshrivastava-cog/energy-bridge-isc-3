space: {{ isc_TypedModelSchemaSpace }}
externalId: StorageBin
name: Storage Bin
description: Leaf storage location in the warehouse hierarchy.
implements:
- space: {{ isc_MaterialManagementSchemaSpace }}
  externalId: StorageLocations
  version: '{{viewVersion}}'
  type: view
version: '{{viewVersion}}'
filter:
  and:
  - hasData:
    - type: container
      space: {{ isc_MaterialManagementSchemaSpace }}
      externalId: StorageLocations
  - equals:
      property:
      - {{ isc_MaterialManagementSchemaSpace }}
      - StorageLocations
      - declaredType
      value:
        space: {{ isc_OrganizationalFoundationSchemaSpace }}
        externalId: StorageBin
properties:
  declaredType:
    container:
      space: {{ isc_MaterialManagementSchemaSpace }}
      externalId: StorageLocations
      type: container
    containerPropertyIdentifier: declaredType
    source:
      space: {{ isc_OrganizationalFoundationSchemaSpace }}
      externalId: DeclaredTypes
      version: '{{viewVersion}}'
      type: view
    name: Declared Type
    description: Concrete view type for this instance.
  zone:
    container:
      space: {{ isc_MaterialManagementSchemaSpace }}
      externalId: StorageLocations
      type: container
    containerPropertyIdentifier: parent
    source:
      space: {{ isc_TypedModelSchemaSpace }}
      externalId: Zone
      version: '{{viewVersion}}'
      type: view
    name: Zone
    description: Parent zone for this storage bin.
  locationType:
    container:
      space: {{ isc_MaterialManagementSchemaSpace }}
      externalId: StorageLocations
      type: container
    containerPropertyIdentifier: locationType
    name: Location Type
    description: Bin role classification, dock, staging, putaway, pick, slotting,
      etc.
  lotsStored:
    connectionType: multi_edge_connection
    direction: inwards
    name: lotsStored
    description: Material lots with balance in this bin. Query LotStoredInBin edges.
    type:
      space: {{ isc_MaterialManagementSchemaSpace }}
      externalId: MaterialLot.storedInBin
    source:
      space: {{ isc_MaterialManagementSchemaSpace }}
      externalId: MaterialLot
      version: '{{viewVersion}}'
      type: view
    edgeSource:
      space: {{ isc_MaterialManagementSchemaSpace }}
      externalId: LotStoredInBin
      version: '{{viewVersion}}'
      type: view
  children:
    source:
      space: {{ isc_MaterialManagementSchemaSpace }}
      externalId: StorageLocations
      version: '{{viewVersion}}'
      type: view
    through:
      source:
        space: {{ isc_MaterialManagementSchemaSpace }}
        externalId: StorageLocations
        version: '{{viewVersion}}'
        type: view
      identifier: parent
    name: Children
    description: Storage hierarchy nodes with this node as their parent.
    connectionType: multi_reverse_direct_relation
