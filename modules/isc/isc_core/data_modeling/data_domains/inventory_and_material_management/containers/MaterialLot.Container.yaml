  expiry_date:
    type:
      list: false
      type: timestamp
    immutable: false
    nullable: true
    autoIncrement: false
    name: Expiry Date
    description: Expiration date for shelf-life managed materials.
  qualityStatus:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Quality Status
    description: Overall quality disposition of the lot for example released, blocked, quarantine.
  qualityInspectionStatus:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Quality Inspection Status
    description: Inspection workflow status for the lot for example pending, in progress, passed, failed.
