space: {{ isc_MaterialManagementSchemaSpace }}
externalId: MaterialMaster
name: MaterialMaster
description: The central repository of material definitions, ISA-95 Material Definition, containing global attributes, technical specifications, and planning parameters for every part. Integrates supply chain master data with ISA-88 and 95 manufacturing execution links, recipe, batch. Quality over completeness principle applied - only properties important for supply chain and manufacturing operations are included.
properties:
  name:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Name
    description: Human-readable name for this node.
  description:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Description
    description: Human-readable description for this node.
  sourceId:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source ID
    description: Identifier from the upstream source system.
  sourceContext:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source Context
    description: Source system or context for this node.
  sourceCreatedTime:
    type:
      list: false
      type: timestamp
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source Created Time
    description: Timestamp when the node was created in the source system.
  sourceUpdatedTime:
    type:
      list: false
      type: timestamp
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source Updated Time
    description: Timestamp when the node was last updated in the source system.
  sourceCreatedUser:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source Created User
    description: User that created this node in the source system.
  sourceUpdatedUser:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source Updated User
    description: User that last updated this node in the source system.
  materialId:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: true
    nullable: false
    autoIncrement: false
    name: Material ID
    description: Unique identifier for the material in the source system. Primary key - immutable once created.
  materialType:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Material Type
    description: material type code controlling field selection and procurement behaviour. Key values - ROH for Raw Material, HALB for Semi-Finished, FERT for Finished Good, ERSA for Spare Part, HIBE for Operating Supply, NLAG for Non-Stock, VERP for Packaging, DIEN for Service, UNBW for Non-Valuated.
  materialClass:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Material Class
    description: Engineering classification of the material for example rotating equipment, piping, electrical, instrumentation. Used for grouping and cross-asset search.
  materialGroup:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Material Group
    description: Procurement-oriented grouping code used for sourcing strategy, spend analysis, and reporting.
  baseUnitOfMeasure:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Base Unit of Measure
    description: The primary unit of measure in which the material is managed. All quantities in other units are converted to this base unit.
  unitOfMeasureRef:
    type:
      list: false
      type: direct
    immutable: false
    nullable: true
    autoIncrement: false
    name: Unit of Measure (Relation)
    description: Typed direct relation to the CogniteUnit node for the base unit of measure. Enables unit-aware graph traversal alongside the baseUnitOfMeasure text field.
  isObsolete:
    type:
      list: false
      type: boolean
    immutable: false
    nullable: true
    autoIncrement: false
    name: Is Obsolete
    description: Flag indicating the material is no longer approved for use in new orders or designs. Triggers alerts when referenced in new work orders or BOMs.
  procurementType:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Procurement Type
    description: Defines how the material is sourced globally - E for External procurement only, F for In-house production only, X for Both allowed.
  goodsReceiptProcessingDays:
    type:
      list: false
      type: int32
    immutable: false
    nullable: true
    autoIncrement: false
    name: Goods Receipt Processing Days
    description: Number of working days required to inspect and process a goods receipt for this material before it becomes available for use.
  contractAvailabilityFlag:
    type:
      list: false
      type: boolean
    immutable: false
    nullable: true
    autoIncrement: false
    name: Contract Availability Flag
    description: Indicates whether an active supply contract exists for this material, enabling direct PO creation against a contract rather than going to the open market.
  isCriticalSpare:
    type:
      list: false
      type: boolean
    immutable: false
    nullable: true
    autoIncrement: false
    name: Is Critical Spare
    description: Flag indicating this is a critical spare part requiring special stocking rules to prevent stockouts. Drives inventory safety stock policy and Command Centre alert thresholds.
  criticalityRating:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Criticality Rating
    description: Criticality classification based on operational impact of unavailability for example A for Mission Critical, B for Important, C for Standard. Used for prioritisation in expediting and stocking decisions.
  abcIndicator:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: ABC Indicator
    description: ABC analysis classification based on consumption value - A for High value and high usage, B for Medium, C for Low. Used for inventory management strategy and cycle counting frequency.
  isHazardous:
    type:
      list: false
      type: boolean
    immutable: false
    nullable: true
    autoIncrement: false
    name: Is Hazardous
    description: Boolean flag indicating this material is classified as hazardous. Triggers special handling, storage, and transport compliance requirements.
  isBatchManaged:
    type:
      list: false
      type: boolean
    immutable: false
    nullable: true
    autoIncrement: false
    name: Is Batch Managed
    description: Indicates whether this material requires batch and lot tracking throughout its lifecycle. Mandatory for Pharma, GMP compliance, regulated chemicals, and any material with shelf life or quality traceability requirements.
  totalShelfLifeDays:
    type:
      list: false
      type: int32
    immutable: false
    nullable: true
    autoIncrement: false
    name: Total Shelf Life Days
    description: Total shelf life of the material in days from the date of production or goods receipt. Used to trigger expiry alerts and manage FEFO, First Expired First Out, picking strategies.
  qualityManagementActive:
    type:
      list: false
      type: boolean
    immutable: false
    nullable: true
    autoIncrement: false
    name: Quality Management Active
    description: Flag indicating quality inspection is active for this material. When true, goods receipts trigger an inspection lot and stock is placed in quality inspection until released.
  isSerialNumberManaged:
    type:
      list: false
      type: boolean
    immutable: false
    nullable: true
    autoIncrement: false
    name: Is Serial Number Managed
    description: Flag indicating this material requires individual serial number tracking for high-value or safety-critical components.
  priceControlIndicator:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Price Control Indicator
    description: Determines the stock valuation method - S for Standard Price, fixed, typical for finished and semi-finished goods, V for Moving Average Price, typical for raw materials and trading goods.
  stdCost:
    type:
      list: false
      type: float64
    immutable: false
    nullable: true
    autoIncrement: false
    name: Standard Cost
    description: Standard cost of the material in the valuation currency. Used for inventory valuation, margin analysis, and standard-price based planning analytics.
  originalEquipmentManufacturer:
    type:
      list: false
      type: direct
    immutable: false
    nullable: true
    autoIncrement: false
    name: Original Equipment Manufacturer
    description: Direct relation to the Supplier node representing the OEM or manufacturer of this material. Enables sourcing directly from the manufacturer when authenticity is required.
  alternativeMaterialAvailable:
    type:
      list: false
      type: boolean
    nullable: true
    immutable: false
    autoIncrement: false
    name: Alternative material available
    description: Boolean flag indicating at least one active alternative exists in the MaterialAlternative container. Enables fast filtering without traversing the alternative graph.
  recipe:
    type:
      list: true
      type: direct
      maxListSize: 1000
    immutable: false
    nullable: true
    autoIncrement: false
    name: Manufacturing Recipes
    description: ISA-88 master recipes that produce or define this material in manufacturing execution. Cross-links to the Recipe view in the ISA manufacturing model for batch and process manufacturing traceability.
  batch:
    type:
      list: true
      type: direct
      maxListSize: 1000
    immutable: false
    nullable: true
    autoIncrement: false
    name: Manufacturing Batches
    description: ISA-88 batch executions associated with this material for operations and genealogy. Cross-links to the Batch view in the ISA manufacturing model.
