    cursorable: false
    indexType: btree
  storageLocation:
    properties:
    - storageLocation
    cursorable: false
    indexType: btree
  scheduledReceipt:
    properties:
    - scheduledReceipt
    cursorable: false
    indexType: btree
  scheduledTransfer:
    properties:
    - scheduledTransfer
    cursorable: false
    indexType: btree
  supplier:
    properties:
    - supplier
    cursorable: false
    indexType: btree
  inspectionDate:
    properties:
    - inspectionDate
    cursorable: true
    indexType: btree
  decisionDate:
    properties:
    - decisionDate
    cursorable: true
    indexType: btree
