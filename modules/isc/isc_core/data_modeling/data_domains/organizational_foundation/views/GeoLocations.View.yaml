  physicalAddress:
    container:
      space: {{ isc_OrganizationalFoundationSchemaSpace }}
      externalId: GeoLocations
      type: container
    containerPropertyIdentifier: physicalAddress
    name: Physical Address
    description: Optional formatted address or locality description for this geographic location.
  children:
