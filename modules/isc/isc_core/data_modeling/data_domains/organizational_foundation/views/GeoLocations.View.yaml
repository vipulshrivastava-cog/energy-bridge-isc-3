      space: {{ isc_OrganizationalFoundationSchemaSpace }}
      externalId: GeoLocations
      type: container
    containerPropertyIdentifier: sourceUpdatedUser
    name: Source Updated User
    description: User that last updated this node in the source system.
  name:
    container:
      space: {{ isc_OrganizationalFoundationSchemaSpace }}
      externalId: GeoLocations
      type: container
    containerPropertyIdentifier: name
    name: Name
    description: Display name for search and UI.
  description:
    container:
      space: {{ isc_OrganizationalFoundationSchemaSpace }}
      externalId: GeoLocations
      type: container
    containerPropertyIdentifier: description
    name: Description
  sourceId:
    container:
      space: {{ isc_OrganizationalFoundationSchemaSpace }}
      externalId: GeoLocations
      type: container
    containerPropertyIdentifier: sourceId
    name: Source ID
  sourceContext:
    container:
      space: {{ isc_OrganizationalFoundationSchemaSpace }}
      externalId: GeoLocations
      type: container
    containerPropertyIdentifier: sourceContext
    name: Source context
  sourceCreatedTime:
