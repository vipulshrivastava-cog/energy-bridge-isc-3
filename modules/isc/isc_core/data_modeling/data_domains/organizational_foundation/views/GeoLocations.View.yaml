space: {{ isc_OrganizationalFoundationSchemaSpace }}
externalId: GeoLocations
name: Geographic Location
description: Geographic hierarchy interface with parent-child navigation for regional, country, and city roll-up. Platform functions and cross-level queries use this view; agents should use concrete types such as Country or City.
version: '{{viewVersion}}'
