      space: {{ isc_OrganizationalFoundationSchemaSpace }}
      externalId: GeoLocations
      type: container
    containerPropertyIdentifier: parent
    name: Parent
    description: The parent of this geographic node in the standardized hierarchy.
    source:
      space: {{ isc_OrganizationalFoundationSchemaSpace }}
      externalId: GeoLocations
      version: '{{viewVersion}}'
      type: view
  root:
    container:
      space: {{ isc_OrganizationalFoundationSchemaSpace }}
      externalId: GeoLocations
      type: container
    containerPropertyIdentifier: root
    name: Root
