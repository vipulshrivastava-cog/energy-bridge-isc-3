space: {{ isc_OrganizationalFoundationSchemaSpace }}
externalId: GeoLocations
name: GeoLocations
description: Geographic location in the supply chain network with parent-child hierarchy
  for regional, country, city, and site roll-up. Includes supplier and customer physical
  locations.
properties:
  sourceCreatedUser:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source Created User
    description: User that created this node in the source system.
  sourceUpdatedUser:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source Updated User
    description: User that last updated this node in the source system.
  name:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: false
    autoIncrement: false
    name: Name
    description: Display name for search and filtering in user interfaces.
  description:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Description
  sourceId:
    type:
      list: false
      collation: ucs_basic
      type: text
    nullable: true
    name: Source ID
  sourceContext:
    type:
      list: false
      collation: ucs_basic
      type: text
    nullable: true
    name: Source context
  sourceCreatedTime:
    type:
      list: false
      type: timestamp
    nullable: true
    name: Source created time
  sourceUpdatedTime:
    type:
      list: false
      type: timestamp
    nullable: true
    name: Source updated time
  parent:
    type:
      list: false
      type: direct
    nullable: true
    name: Parent
    description: Parent node in the hierarchy. Null for root nodes.
  root:
    type:
      list: false
      type: direct
    nullable: true
    name: Root
    description: Top-level root node for this hierarchy branch. Maintained by hierarchy
      path sync.
  path:
    type:
      list: true
      maxListSize: 100
      type: direct
    nullable: true
    name: Path
    description: Ancestor chain root, through , self. Maintained by path pass. maxListSize
      100 matches CogniteAsset assetHierarchy path.
  pathLastUpdatedTime:
    type:
      list: false
      type: timestamp
    nullable: true
    name: Path last updated time
  declaredType:
    type:
      list: false
      type: direct
    nullable: true
    name: Declared Type
    description: Direct relation to DeclaredTypes catalog instance for this node's level.
  locationCode:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Location Code
    description: Unique short code for this geographic location, for example ISO or
      geographic code.
  isoCode:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: ISO Code
    description: ISO 3166-1 Alpha-3 country code or equivalent standard geographic
      code. Applicable primarily to Country level nodes.
  latitude:
    type:
      list: false
      type: float64
    immutable: false
    nullable: true
    autoIncrement: false
    name: Latitude
    description: WGS84 latitude coordinate for this geographic node or representative
      centroid.
  longitude:
    type:
      list: false
      type: float64
    immutable: false
    nullable: true
    autoIncrement: false
    name: Longitude
    description: WGS84 longitude coordinate for this geographic node or representative
      centroid.
  physicalAddress:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Physical Address
    description: Optional formatted address or locality description for this geographic
      location.
    autoIncrement: false
    name: Location Type
    description: Hierarchy level of this geographic node. Expected values are GeoRegion,
      Country, or City.
indexes:
  parent:
    properties:
    - parent
    cursorable: false
    indexType: btree
  root:
    properties:
    - root
    cursorable: false
    indexType: btree
  path:
    properties:
    - path
    cursorable: false
    indexType: btree
  name:
    properties:
    - name
    cursorable: false
    indexType: btree
  sourceId:
    properties:
    - sourceId
    cursorable: true
    indexType: btree
  sourceCreatedTime:
    properties:
    - sourceCreatedTime
    cursorable: false
    indexType: btree
  sourceUpdatedTime:
    properties:
    - sourceUpdatedTime
    cursorable: true
    indexType: btree
  locationCode:
    properties:
    - locationCode
    cursorable: true
    indexType: btree
  declaredType:
    properties:
    - declaredType
    cursorable: true
    indexType: btree
usedFor: node
