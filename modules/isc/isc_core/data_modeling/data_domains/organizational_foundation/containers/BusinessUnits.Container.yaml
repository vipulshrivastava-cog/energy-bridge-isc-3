space: {{ isc_OrganizationalFoundationSchemaSpace }}
externalId: BusinessUnits
name: BusinessUnits
description: Organisational hierarchy node for enterprise financial structure such
  as company, controlling area, business unit, cost center, profit center, and purchasing
  organisation.
properties:
  sourceCreatedUser:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source Created User
    description: User that created this node in the source system.
  sourceUpdatedUser:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source Updated User
    description: User that last updated this node in the source system.
  name:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: false
    autoIncrement: false
    name: Name
    description: Display name for search and filtering in user interfaces.
  description:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Description
  sourceId:
    type:
      list: false
      collation: ucs_basic
      type: text
    nullable: true
    name: Source ID
  sourceContext:
    type:
      list: false
      collation: ucs_basic
      type: text
    nullable: true
    name: Source context
  sourceCreatedTime:
    type:
      list: false
      type: timestamp
    nullable: true
    name: Source created time
  sourceUpdatedTime:
    type:
      list: false
      type: timestamp
    nullable: true
    name: Source updated time
  parent:
    type:
      list: false
      type: direct
    nullable: true
    name: Parent
    description: Parent node in the hierarchy. Null for root nodes.
  root:
    type:
      list: false
      type: direct
    nullable: true
    name: Root
    description: Top-level root node for this hierarchy branch. Maintained by hierarchy
      path sync.
  path:
    type:
      list: true
      maxListSize: 100
      type: direct
    nullable: true
    name: Path
    description: Ancestor chain root, through , self. Maintained by path pass. maxListSize
      100 matches CogniteAsset assetHierarchy path.
  pathLastUpdatedTime:
    type:
      list: false
      type: timestamp
    nullable: true
    name: Path last updated time
  declaredType:
    type:
      list: false
      type: direct
    nullable: true
    name: Declared Type
    description: Direct relation to DeclaredTypes catalog instance for this node's level.
  hierarchyCode:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Hierarchy Code
    description: Short unique code identifying this node in the source system.
  companyCode:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Company Code
    description: Company code. Legal entity for financial accounting. Applicable at
      Company level nodes.
  controllingArea:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Controlling Area
    description: Controlling area. Spans one or more company codes for management
      accounting. Applicable at ControllingArea level nodes.
  costCenter:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Cost Center
    description: Cost center. Used for internal cost allocation and cost-center reporting.
      Applicable at CostCenter level nodes.
  profitCenter:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Profit Center
    description: Profit center. Used for internal profitability reporting. Applicable
      at ProfitCenter level nodes.
  purchasingOrg:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Purchasing Organisation
    description: Purchasing Organisation. Responsible for procurement activities.
      Applicable at PurchasingOrg level nodes.
  currency:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Currency
    description: ISO 4217 currency code for this business entity for example NOK,
      USD, EUR. Applicable at Company and ControllingArea level nodes.
