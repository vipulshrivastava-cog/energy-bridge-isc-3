    - forecastStatus
    cursorable: true
    indexType: btree
  material:
    properties:
    - material
    cursorable: false
    indexType: btree
  plant:
    properties:
    - plant
    cursorable: false
    indexType: btree
  storageLocation:
    properties:
    - storageLocation
    cursorable: false
    indexType: btree
  workOrder:
    properties:
    - workOrder
    cursorable: false
    indexType: btree
  customerOrderLineItem:
    properties:
    - customerOrderLineItem
    cursorable: false
    indexType: btree
  productionRequest:
    properties:
    - productionRequest
    cursorable: false
    indexType: btree
  plannedOrder:
    properties:
    - plannedOrder
    cursorable: false
    indexType: btree
usedFor: node