space: {{ isc_ShipmentDeliverySchemaSpace }}
externalId: ShipmentExecutesTransfer
name: Shipment Executes Transfer
description: Edge container linking a shipment to a scheduled stock transfer. execution quantity and status facts live on the edge.
usedFor: edge
properties:
