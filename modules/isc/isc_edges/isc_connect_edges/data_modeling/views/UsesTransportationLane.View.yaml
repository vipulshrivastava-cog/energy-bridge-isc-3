space: {{ isc_ShipmentDeliverySchemaSpace }}
externalId: UsesTransportationLane
name: Uses Transportation Lane
description: Queryable edge view linking shipments or production schedules to transportation lanes, with multi-hop leg sequence and role, planned and actual transit duration, cost, and customs clearance on the edge.
version: '{{viewVersion}}'
properties:
  name:
    container:
      space: {{ isc_ShipmentDeliverySchemaSpace }}
      externalId: UsesTransportationLane
      type: container
    containerPropertyIdentifier: name
    name: Name
    description: Human-readable name for this node.
  description:
    container:
      space: {{ isc_ShipmentDeliverySchemaSpace }}
      externalId: UsesTransportationLane
      type: container
    containerPropertyIdentifier: description
    name: Description
    description: Human-readable description for this node.
