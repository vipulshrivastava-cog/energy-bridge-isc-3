space: {{ isc_MaterialManagementSchemaSpace }}
externalId: MaterialReservation
name: Material Reservation
description: Edge container carrying reservation attributes on relationships that commit aggregate material inventory to a demand source, work order component, production request, or customer order. Each edge carries reservation number, reserved quantity, and reservation and requirement dates.
usedFor: edge
