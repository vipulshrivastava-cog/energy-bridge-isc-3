space: {{ isc_OrganizationalFoundationSchemaSpace }}
externalId: NotificationLinksEntity
name: Notification Links Entity
description: Edge container linking a master notification to an affected entity for example work order. link role, severity, and correlation id live on the edge.
usedFor: edge
properties:
  name:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Name
    description: Human-readable name for this node.
  description:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Description
    description: Human-readable description for this node.
  sourceId:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source ID
    description: Identifier from the upstream source system.
  sourceContext:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source Context
    description: Source system or context for this node.
  sourceCreatedTime:
    type:
      list: false
      type: timestamp
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source Created Time
    description: Timestamp when the node was created in the source system.
  sourceUpdatedTime:
    type:
      list: false
      type: timestamp
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source Updated Time
    description: Timestamp when the node was last updated in the source system.
  sourceCreatedUser:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source Created User
    description: User that created this node in the source system.
  sourceUpdatedUser:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source Updated User
    description: User that last updated this node in the source system.
  relationType:
    type:
      list: False
      collation: ucs_basic
      type: text
    immutable: false
    nullable: false
    autoIncrement: false
    name: Relation Type
    description: Semantic role of the link, reservation, assignment, pegging, execution, impact.
  relationStatus:
    type:
      list: False
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Relation Status
    description: Lifecycle status of the link, planned, active, fulfilled, cancelled.
  validFrom:
    type:
      list: False
      type: timestamp
    immutable: false
    nullable: false
    autoIncrement: false
    name: Valid From
    description: Business start date when this link becomes effective.
  validTo:
    type:
      list: False
      type: timestamp
    immutable: false
    nullable: true
    autoIncrement: false
    name: Valid To
    description: Business end date when this link ceases to be effective. Null means open-ended.
  linkRole:
    type:
      list: False
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Link Role
    description: Event link role, trigger, impacted, related, symptom.
  severityAtLinkTime:
    type:
      list: False
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Severity At Link Time
    description: Severity recorded when the notification link was created.
  correlationId:
    type:
      list: False
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Correlation ID
    description: Correlation identifier across related event links.
  impactCategory:
    type:
      list: False
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Impact Category
    description: Impact category for notification or schedule links.
indexes:
  validFrom:
    properties:
    - validFrom
    cursorable: true
    indexType: btree
  validTo:
    properties:
    - validTo
    cursorable: true
    indexType: btree
  relationStatus:
    properties:
    - relationStatus
    cursorable: true
    indexType: btree